<!DOCTYPE html>
<html lang="es">

<head>
    <!-- META TAGS ESENCIALES -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Extravagante: Perfumería exclusiva con fragancias premium importadas. Descubre nuestra colección de perfumes para hombre, mujer y árabes con asesoría personalizada.">
    <meta name="keywords" content="perfumes luxury, fragancias importadas, perfumes hombre, perfumes mujer, perfumes árabes, perfumería online">
    <meta name="author" content="Extravagante Perfumería">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="robots" content="index, follow">
    
    <!-- OPEN GRAPH (REDES SOCIALES) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Extravagante | Perfumería Luxury Exclusiva">
    <meta property="og:description" content="Fragancias premium importadas con asesoría personalizada. Descubre nuestras colecciones de lujo.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1583467875263-d50dec37a88c?auto=format&fit=crop&q=80&w=1200">
    
    <title>Extravagante | Perfumería Luxury Exclusiva</title>
    
    <!-- ESTILOS -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- PRELOAD DE RECURSOS CRÍTICOS -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;600&display=swap" as="style">
    <link rel="preload" href="script.js" as="script">
</head>

<body class="flex-container">

    <!-- SIDEBAR PRINCIPAL -->
    <aside class="sidebar">
        <div class="brand-header">
            <h1 class="brand-title serif">EXTRAVAGANTE</h1>
            <p class="brand-subtitle">Perfumería Exclusiva</p>
        </div>

        <nav role="navigation" aria-label="Menú principal">
            <p aria-label="Sección Explorar">Explorar</p>
            <button onclick="filtrarProductos('TODOS')" aria-label="Ver todos los productos">
                Todos los Productos
            </button>
            <button onclick="filtrarProductos('Mujer')" aria-label="Ver perfumes de mujer">
                Perfumes de Mujer
            </button>
            <button onclick="filtrarProductos('Hombre')" aria-label="Ver perfumes de hombre">
                Perfumes de Hombre
            </button>
            <button onclick="filtrarProductos('Arabes')" aria-label="Ver perfumes árabes">
                Perfumes Árabes
            </button>
            <button onclick="filtrarProductos('SI')" class="offer-btn" aria-label="Ver ofertas especiales">
                ¡OFERTAS!
            </button>
        </nav>
    </aside>

    <div class="sidebar-spacer"></div>

    <!-- CONTENIDO PRINCIPAL -->
    <main role="main">
        <!-- HEADER -->
        <header>
            <input 
                type="text" 
                id="buscador" 
                class="search-bar"
                onkeyup="buscarProducto()" 
                placeholder="Buscar fragancia..."
                aria-label="Buscador de productos"
            >
            <div>
                <button 
                    class="cart-button"
                    onclick="toggleCart()"
                    aria-label="Abrir carrito de compras"
                    aria-expanded="false"
                >
                    <span>Carrito</span>
                    <span class="cart-count" id="cart-count">0</span>
                </button>
            </div>
        </header>

        <!-- HERO SECTION -->
        <section class="hero" role="banner" aria-label="Sección promocional">
            <img 
                src="https://images.unsplash.com/photo-1583467875263-d50dec37a88c?auto=format&fit=crop&q=80&w=1000"
                alt="Fragancias de lujo"
                class="hero-image"
                loading="lazy"
            >
            <div class="hero-content">
                <h2 class="serif">Colección Premium</h2>
                <p>Fragancias importadas con asesoría personalizada.</p>
                <a href="#productos-inicio" class="cta-button">
                    Ver Catálogo
                </a>
            </div>
        </section>

        <!-- SECCIÓN DE PRODUCTOS -->
        <section id="productos-inicio" class="products-section" role="region" aria-label="Catálogo de productos">
            <div class="products-grid" id="contenedor-productos" role="list">
                <!-- Los productos se cargan aquí dinámicamente -->
            </div>
        </section>
    </main>

    <!-- CARRITO LATERAL -->
    <div id="cart-sidebar" class="cart-sidebar" role="dialog" aria-label="Carrito de compras" aria-modal="true">
        <div class="cart-header">
            <h2 class="serif">Tu Pedido</h2>
            <button 
                onclick="toggleCart()" 
                class="close-cart"
                aria-label="Cerrar carrito"
                title="Cerrar (ESC)"
            >
                ✕
            </button>
        </div>
        
        <div class="cart-items-list" id="cart-items" role="list">
            <!-- Los items del carrito se cargan aquí -->
        </div>

        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span class="cart-total-value" id="cart-total">$0</span>
            </div>
            <button 
                onclick="enviarWhatsApp()"
                class="whatsapp-button"
                title="Finalizar pedido por WhatsApp"
            >
                Finalizar pedido por WhatsApp
            </button>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="script.js" defer></script></body>

</html>
